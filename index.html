document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 src: url(\"83a5cc8b-0446-4211-a90e-d9ac81bbfe17\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"8fb24ab6-ffbf-4f74-88a1-3e681d8d6ca3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"b50ea009-45f5-4df6-8e5c-d4499626e783\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   Colors — And 3rd Media\n   Dark-first palette. Near-black surfaces step up in lightness\n   (base → card → input); a single Supabase-style green accent\n   carries all primary action and \"success/online\" meaning.\n   ============================================================ */\n\n:root {\n  /* ---- Surfaces (dark, low-chroma, stepped) ---- */\n  --bg-base: #0f0f0f;        /* page background */\n  --bg-card: #1a1a1a;        /* cards, headers, raised panels */\n  --bg-input: #1f1f1f;       /* inputs, wells, dropzone interior */\n\n  /* ---- Borders / hairlines ---- */\n  --border: #2a2a2a;         /* default 1px hairline */\n  --border-hover: #3a3a3a;   /* scrollbar thumb, subtle hover */\n\n  /* ---- Text ---- */\n  --text-primary: #f0f0f0;   /* headings, primary copy */\n  --text-secondary: #b4b4b4; /* body, labels */\n  --text-muted: #888888;     /* meta, hints, disabled-ish */\n\n  /* ---- Accent (brand green) ---- */\n  --accent: #3ecf8e;             /* primary action, links, success */\n  --accent-hover: #2db87a;       /* pressed/darker accent */\n  --accent-muted: rgba(62, 207, 142, 0.10);   /* accent fill / wash */\n  --accent-border: rgba(62, 207, 142, 0.20);  /* accent hairline */\n\n  /* ---- Brand play-mark gradient (logo) ---- */\n  --brand-play-from: #b8d4a0;\n  --brand-play-to: #7aaa5e;\n  --brand-chrome: #c4cdd6;   /* the grey \"TV\" body */\n\n  /* ---- Status / semantic ---- */\n  --danger: #f87171;         /* destructive text + thin bars */\n  --danger-strong: #ef4444;  /* destructive button fill, max usage */\n  --warn: #f97316;           /* orange — high usage */\n  --caution: #eab308;        /* yellow — medium usage / queue busy */\n\n  /* ---- External brand ---- */\n  --discord: #5865F2;        /* Discord buttons / links */\n\n  /* ---- Beta banner ---- */\n  --beta-bg: #1e293b;        /* slate banner background */\n  --beta-text: #94a3b8;      /* slate banner text */\n\n  /* ---- White-glow hover system ---- */\n  --glow-line: rgba(255, 255, 255, 0.65);   /* border on hover */\n  --glow-ring: rgba(255, 255, 255, 0.15);   /* 1px outline */\n  --glow-bloom: rgba(255, 255, 255, 0.08);  /* soft bloom */\n\n  /* ---- Semantic aliases ---- */\n  --surface-page: var(--bg-base);\n  --surface-card: var(--bg-card);\n  --surface-field: var(--bg-input);\n  --text-on-accent: #000000;     /* black text on the green button */\n  --link: var(--accent);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Typography — And 3rd Media\n   One geometric humanist sans for everything (LINE Seed JP,\n   substituted by Zen Kaku Gothic New). Mono only for URLs.\n   The UI is compact: most copy sits at 12–14px, headings at\n   16–20px. Weights used: 400 / 500 / 600 / 700.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  /* Primary stays 'LINE Seed JP'; until its webfonts are uploaded,\n     it falls back to the platform JA-capable system sans. */\n  --font-sans: 'LINE Seed JP', system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', Meiryo, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium: 500;   /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700;     /* @kind font */\n\n  /* ---- Size scale (compact UI) ---- */\n  --text-xs: 0.75rem;    /* 12px — meta, hints, most buttons */\n  --text-sm: 0.875rem;   /* 14px — body, labels, titles */\n  --text-base: 1rem;     /* 16px */\n  --text-lg: 1.125rem;   /* 18px — card headings */\n  --text-xl: 1.25rem;    /* 20px — plan price, usage figure */\n  --text-2xl: 1.5rem;    /* 24px */\n  --text-display: clamp(28px, 6vw, 48px); /* welcome / brand wordmark */\n\n  /* ---- Line heights ---- */\n  --lh-tight: 1.1;   /* @kind other */\n  --lh-snug: 1.35;   /* @kind other */\n  --lh-normal: 1.6;  /* @kind other */\n\n  /* ---- Letter spacing ---- */\n  --ls-tight: -0.01em;   /* @kind other */\n  --ls-normal: 0;        /* @kind other */\n  --ls-wide: 0.02em;     /* @kind other */\n  --ls-eyebrow: 0.42em;  /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Spacing & Radius — And 3rd Media\n   4px base rhythm. Radii are generous and soft: pills for\n   chips/badges, ~12px for cards, ~8px for inputs/buttons.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.25rem;   /* 20 */\n  --space-6: 1.5rem;    /* 24 */\n  --space-8: 2rem;      /* 32 */\n  --space-12: 3rem;     /* 48 */\n\n  /* ---- Radius ---- */\n  --radius-sm: 0.375rem;  /* 6px — small buttons, tags */\n  --radius-md: 0.5rem;    /* 8px — inputs, buttons, dropzone */\n  --radius-lg: 0.75rem;   /* 12px — cards, panels */\n  --radius-xl: 1rem;      /* 16px — large surfaces */\n  --radius-full: 9999px;  /* pills, badges, orbs, bars */\n\n  /* ---- Hairline width ---- */\n  --hairline: 1px;\n\n  /* ---- Common container widths ---- */\n  --w-card: 36rem;    /* max-w-xl upload card column */\n  --w-page: 64rem;    /* max-w-5xl mypage column */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Effects — And 3rd Media\n   The signature interaction is the WHITE-GLOW hover: interactive\n   surfaces sit on a green (--accent) hairline at rest and shift\n   to a bright white border + soft white bloom on hover. Buttons\n   press with a springy scale(0.94) and emit a ripple. Motion is\n   quick (0.12–0.2s); easing is spring on press, ease elsewhere.\n   ============================================================ */\n\n:root {\n  /* ---- Shadows (used sparingly; surfaces lean on borders) ---- */\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);\n  --shadow-lg: 0 10px 50px rgba(0, 0, 0, 0.35);\n\n  /* ---- White-glow hover (the brand's core hover) ---- */\n  --glow-hover: 0 0 0 1px var(--glow-ring), 0 0 14px 3px var(--glow-bloom);\n\n  /* ---- Accent glow (particles, online orbs) ---- */\n  --glow-accent: 0 0 6px 2px rgba(62, 207, 142, 0.50);\n\n  /* ---- Glass panel (loading screen lens) ---- */\n  --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));\n  --glass-border: rgba(255, 255, 255, 0.18);\n  --glass-blur: blur(16px) saturate(150%); /* @kind other */\n\n  /* ---- Transitions ---- */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);  /* @kind other */\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);  /* @kind other */\n  --t-fast: 0.12s;  /* @kind other */\n  --t-base: 0.2s;   /* @kind other */\n  --t-slow: 0.6s;   /* @kind other */\n}\n\n/* ---- Reusable hover-glow utility (green border → white glow) ---- */\n.a3-hover-glow {\n  border: var(--hairline) solid var(--accent);\n  transition: border-color var(--t-base) ease, box-shadow var(--t-base) ease, color var(--t-base) ease;\n}\n.a3-hover-glow:hover {\n  border-color: var(--glow-line);\n  box-shadow: var(--glow-hover);\n}\n\n@keyframes a3-btn-white-glow {\n  0%, 100% { box-shadow: 0 0 6px 0 rgba(255,255,255,0.10); }\n  50%      { box-shadow: 0 0 16px 3px rgba(255,255,255,0.18); }\n}\n@keyframes a3-ripple-expand {\n  0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }\n  100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Base — And 3rd Media\n   Minimal resets + body defaults so cards/kits inherit the\n   brand look automatically. Mirrors the product's globals.css.\n   ============================================================ */\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg-base);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--text-sm);\n  line-height: var(--lh-snug);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n::selection {\n  background: var(--accent-muted);\n  color: var(--accent);\n}\n\n/* Thin dark scrollbars */\n::-webkit-scrollbar { width: 6px; height: 6px; }\n::-webkit-scrollbar-track { background: var(--bg-base); }\n::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: var(--radius-sm); }\n\na { color: var(--link); text-decoration: none; }\n<\u002Fstyle>\n  <style>/* ============================================================\n   And 3rd Media — Design System\n   Global stylesheet entry point. Consumers link THIS file.\n   Keep this as @import lines only — no rules here.\n   ============================================================ */\n\n/* ============================================================\n   Fonts — And 3rd Media\n   The product UI uses \"LINE Seed JP\" (a clean geometric JP/Latin\n   sans by LINE). Those binaries are not distributed here yet, so\n   --font-sans keeps 'LINE Seed JP' as its primary family and falls\n   back to the platform's JA-capable system sans until the real\n   webfont files are uploaded. No substitute family is loaded.\n\n   ⚠ Upload the LINE Seed JP webfonts and add an @font-face here;\n   the token already points at the right family name.\n\n   Only the monospace face (generated URLs) is web-loaded.\n   ============================================================ */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4f1d0062-4174-4ce1-919b-b711a5156a8e\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3a03aa19-918f-4b1f-95d1-10cb1bc5222f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"da35057d-8b7c-46aa-aa67-2362f2690378\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"83a5cc8b-0446-4211-a90e-d9ac81bbfe17\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8fb24ab6-ffbf-4f74-88a1-3e681d8d6ca3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b50ea009-45f5-4df6-8e5c-d4499626e783\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"4f1d0062-4174-4ce1-919b-b711a5156a8e\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"3a03aa19-918f-4b1f-95d1-10cb1bc5222f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"da35057d-8b7c-46aa-aa67-2362f2690378\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"83a5cc8b-0446-4211-a90e-d9ac81bbfe17\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"8fb24ab6-ffbf-4f74-88a1-3e681d8d6ca3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"b50ea009-45f5-4df6-8e5c-d4499626e783\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   Colors — And 3rd Media\n   Dark-first palette. Near-black surfaces step up in lightness\n   (base → card → input); a single Supabase-style green accent\n   carries all primary action and \"success/online\" meaning.\n   ============================================================ */\n\n:root {\n  /* ---- Surfaces (dark, low-chroma, stepped) ---- */\n  --bg-base: #0f0f0f;        /* page background */\n  --bg-card: #1a1a1a;        /* cards, headers, raised panels */\n  --bg-input: #1f1f1f;       /* inputs, wells, dropzone interior */\n\n  /* ---- Borders / hairlines ---- */\n  --border: #2a2a2a;         /* default 1px hairline */\n  --border-hover: #3a3a3a;   /* scrollbar thumb, subtle hover */\n\n  /* ---- Text ---- */\n  --text-primary: #f0f0f0;   /* headings, primary copy */\n  --text-secondary: #b4b4b4; /* body, labels */\n  --text-muted: #888888;     /* meta, hints, disabled-ish */\n\n  /* ---- Accent (brand green) ---- */\n  --accent: #3ecf8e;             /* primary action, links, success */\n  --accent-hover: #2db87a;       /* pressed/darker accent */\n  --accent-muted: rgba(62, 207, 142, 0.10);   /* accent fill / wash */\n  --accent-border: rgba(62, 207, 142, 0.20);  /* accent hairline */\n\n  /* ---- Brand play-mark gradient (logo) ---- */\n  --brand-play-from: #b8d4a0;\n  --brand-play-to: #7aaa5e;\n  --brand-chrome: #c4cdd6;   /* the grey \"TV\" body */\n\n  /* ---- Status / semantic ---- */\n  --danger: #f87171;         /* destructive text + thin bars */\n  --danger-strong: #ef4444;  /* destructive button fill, max usage */\n  --warn: #f97316;           /* orange — high usage */\n  --caution: #eab308;        /* yellow — medium usage / queue busy */\n\n  /* ---- External brand ---- */\n  --discord: #5865F2;        /* Discord buttons / links */\n\n  /* ---- Beta banner ---- */\n  --beta-bg: #1e293b;        /* slate banner background */\n  --beta-text: #94a3b8;      /* slate banner text */\n\n  /* ---- White-glow hover system ---- */\n  --glow-line: rgba(255, 255, 255, 0.65);   /* border on hover */\n  --glow-ring: rgba(255, 255, 255, 0.15);   /* 1px outline */\n  --glow-bloom: rgba(255, 255, 255, 0.08);  /* soft bloom */\n\n  /* ---- Semantic aliases ---- */\n  --surface-page: var(--bg-base);\n  --surface-card: var(--bg-card);\n  --surface-field: var(--bg-input);\n  --text-on-accent: #000000;     /* black text on the green button */\n  --link: var(--accent);\n}\n\n/* ============================================================\n   Typography — And 3rd Media\n   One geometric humanist sans for everything (LINE Seed JP,\n   substituted by Zen Kaku Gothic New). Mono only for URLs.\n   The UI is compact: most copy sits at 12–14px, headings at\n   16–20px. Weights used: 400 / 500 / 600 / 700.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  /* Primary stays 'LINE Seed JP'; until its webfonts are uploaded,\n     it falls back to the platform JA-capable system sans. */\n  --font-sans: 'LINE Seed JP', system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', Meiryo, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium: 500;   /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700;     /* @kind font */\n\n  /* ---- Size scale (compact UI) ---- */\n  --text-xs: 0.75rem;    /* 12px — meta, hints, most buttons */\n  --text-sm: 0.875rem;   /* 14px — body, labels, titles */\n  --text-base: 1rem;     /* 16px */\n  --text-lg: 1.125rem;   /* 18px — card headings */\n  --text-xl: 1.25rem;    /* 20px — plan price, usage figure */\n  --text-2xl: 1.5rem;    /* 24px */\n  --text-display: clamp(28px, 6vw, 48px); /* welcome / brand wordmark */\n\n  /* ---- Line heights ---- */\n  --lh-tight: 1.1;   /* @kind other */\n  --lh-snug: 1.35;   /* @kind other */\n  --lh-normal: 1.6;  /* @kind other */\n\n  /* ---- Letter spacing ---- */\n  --ls-tight: -0.01em;   /* @kind other */\n  --ls-normal: 0;        /* @kind other */\n  --ls-wide: 0.02em;     /* @kind other */\n  --ls-eyebrow: 0.42em;  /* @kind other */\n}\n\n/* ============================================================\n   Spacing & Radius — And 3rd Media\n   4px base rhythm. Radii are generous and soft: pills for\n   chips/badges, ~12px for cards, ~8px for inputs/buttons.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.25rem;   /* 20 */\n  --space-6: 1.5rem;    /* 24 */\n  --space-8: 2rem;      /* 32 */\n  --space-12: 3rem;     /* 48 */\n\n  /* ---- Radius ---- */\n  --radius-sm: 0.375rem;  /* 6px — small buttons, tags */\n  --radius-md: 0.5rem;    /* 8px — inputs, buttons, dropzone */\n  --radius-lg: 0.75rem;   /* 12px — cards, panels */\n  --radius-xl: 1rem;      /* 16px — large surfaces */\n  --radius-full: 9999px;  /* pills, badges, orbs, bars */\n\n  /* ---- Hairline width ---- */\n  --hairline: 1px;\n\n  /* ---- Common container widths ---- */\n  --w-card: 36rem;    /* max-w-xl upload card column */\n  --w-page: 64rem;    /* max-w-5xl mypage column */\n}\n\n/* ============================================================\n   Effects — And 3rd Media\n   The signature interaction is the WHITE-GLOW hover: interactive\n   surfaces sit on a green (--accent) hairline at rest and shift\n   to a bright white border + soft white bloom on hover. Buttons\n   press with a springy scale(0.94) and emit a ripple. Motion is\n   quick (0.12–0.2s); easing is spring on press, ease elsewhere.\n   ============================================================ */\n\n:root {\n  /* ---- Shadows (used sparingly; surfaces lean on borders) ---- */\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);\n  --shadow-lg: 0 10px 50px rgba(0, 0, 0, 0.35);\n\n  /* ---- White-glow hover (the brand's core hover) ---- */\n  --glow-hover: 0 0 0 1px var(--glow-ring), 0 0 14px 3px var(--glow-bloom);\n\n  /* ---- Accent glow (particles, online orbs) ---- */\n  --glow-accent: 0 0 6px 2px rgba(62, 207, 142, 0.50);\n\n  /* ---- Glass panel (loading screen lens) ---- */\n  --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));\n  --glass-border: rgba(255, 255, 255, 0.18);\n  --glass-blur: blur(16px) saturate(150%); /* @kind other */\n\n  /* ---- Transitions ---- */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);  /* @kind other */\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);  /* @kind other */\n  --t-fast: 0.12s;  /* @kind other */\n  --t-base: 0.2s;   /* @kind other */\n  --t-slow: 0.6s;   /* @kind other */\n}\n\n/* ---- Reusable hover-glow utility (green border → white glow) ---- */\n.a3-hover-glow {\n  border: var(--hairline) solid var(--accent);\n  transition: border-color var(--t-base) ease, box-shadow var(--t-base) ease, color var(--t-base) ease;\n}\n.a3-hover-glow:hover {\n  border-color: var(--glow-line);\n  box-shadow: var(--glow-hover);\n}\n\n@keyframes a3-btn-white-glow {\n  0%, 100% { box-shadow: 0 0 6px 0 rgba(255,255,255,0.10); }\n  50%      { box-shadow: 0 0 16px 3px rgba(255,255,255,0.18); }\n}\n@keyframes a3-ripple-expand {\n  0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }\n  100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }\n}\n\n/* ============================================================\n   Base — And 3rd Media\n   Minimal resets + body defaults so cards/kits inherit the\n   brand look automatically. Mirrors the product's globals.css.\n   ============================================================ */\n\n* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg-base);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--text-sm);\n  line-height: var(--lh-snug);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n::selection {\n  background: var(--accent-muted);\n  color: var(--accent);\n}\n\n/* Thin dark scrollbars */\n::-webkit-scrollbar { width: 6px; height: 6px; }\n::-webkit-scrollbar-track { background: var(--bg-base); }\n::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: var(--radius-sm); }\n\na { color: var(--link); text-decoration: none; }\n\n<\u002Fstyle>\n  <script src=\"0fc12bf0-e3fd-46b0-a972-bf6772465f9d\"><\u002Fscript>\n  <script src=\"789bfd17-5f41-4293-80e1-523bc61dfd43\"><\u002Fscript>\n  <style>\n    @keyframes gt-glow-pulse {\n      0%, 100% { opacity: 0.55; filter: drop-shadow(0 0 6px rgba(62,207,142,0.5)); }\n      50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(62,207,142,0.85)); }\n    }\n    @keyframes gt-scan {\n      0% { background-position: 0 0; }\n      100% { background-position: 0 40px; }\ tyle=\"font-family: var(--font-mono); font-size: 12px; letter-spacing: var(--ls-eyebrow); color: var(--accent); text-transform: uppercase; margin-bottom: 6px;\">Racing &amp; Custom Culture Series<\u002Fdiv>\n          <div style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);\">SEASON 01 · 全3戦シリーズ<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h1 style=\"font-size: clamp(48px, 9vw, 118px); font-weight: 700; line-height: 0.98; letter-spacing: -0.02em; margin: 0 0 8px; color: var(--text-primary);\">\n        らぶぐらっ<span style=\"color: var(--accent); text-shadow: 0 0 30px rgba(62,207,142,0.55), 0 0 70px rgba(62,207,142,0.25);\">GT<\u002Fspan>\n      <\u002Fh1>\n      <div style=\"font-size: clamp(22px, 3vw, 34px); font-weight: 600; color: var(--text-secondary); letter-spacing: 0.02em; margin-bottom: 36px;\">\n        オフィシャル・ルールブック\n      <\u002Fdiv>\n\n      <p style=\"max-width: 680px; font-size: 17px; line-height: var(--lh-normal); color: var(--text-secondary); margin: 0 0 44px;\">\n        レース文化および車両文化の発展を目的として開催される、長期シリーズ型レースイベント。単発ではなく全3戦のシリーズ戦とし、各戦の順位に応じたポイントで総合順位を決定する。\n      <\u002Fp>\n\n      <div style=\"display: flex; gap: 16px; flex-wrap: wrap;\">\n        <div style=\"border: 1px solid var(--accent-border); background: var(--accent-muted); border-radius: var(--radius-lg); padding: 18px 26px; min-width: 150px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--accent);\">全3戦<\u002Fdiv>\n          <div style=\"font-size: 12px; color: var(--text-muted); margin-top: 4px;\">シリーズ構成<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 18px 26px; min-width: 150px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--text-primary);\">1,000万<\u002Fdiv>\n          <div style=\"font-size: 12px; color: var(--text-muted); margin-top: 4px;\">参加費<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 18px 26px; min-width: 150px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--text-primary);\">7月末〜<\u002Fdiv>\n          <div style=\"font-size: 12px; color: var(--text-muted); margin-top: 4px;\">開催予定<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position: absolute; bottom: 28px; left: 0; right: 0; display: flex; justify-content: center; animation: gt-glow-pulse 2.2s ease-in-out infinite;\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- checkered divider -->\n  <div style=\"height: 10px; width: 100%; background-image: conic-gradient(var(--bg-input) 90deg, transparent 90deg 180deg, var(--bg-input) 180deg 270deg, transparent 270deg); background-size: 20px 20px; opacity: 0.9;\"><\u002Fdiv>\n\n  <!-- ============ TOC ============ -->\n  <section data-screen-label=\"TOC\" style=\"padding: 90px 48px; max-width: 1180px; margin: 0 auto;\">\n    <div style=\"display:flex; align-items:baseline; gap:16px; margin-bottom: 44px;\">\n      <span style=\"font-family: var(--font-mono); color: var(--accent); font-size: 13px; letter-spacing: var(--ls-eyebrow); text-transform:uppercase;\">Index<\u002Fspan>\n      <h2 style=\"font-size: 34px; font-weight: 700; margin: 0;\">目次<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;\">\n      <sc-for list=\"{{ tocItems }}\" as=\"item\" hint-placeholder-count=\"14\">\n        <a href=\"{{ item.href }}\" class=\"a3-hover-glow\" style=\"display: flex; align-items: center; gap: 16px; padding: 20px 22px; background: var(--bg-card); text-decoration: none; color: var(--text-primary); border: none;\">\n          <span style=\"font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--accent); min-width: 34px;\">{{ item.num }}<\u002Fspan>\n          <span style=\"font-size: 14px; font-weight: 500; line-height: 1.4;\">{{ item.title }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 01 大会概要 ============ -->\n  <section id=\"ch-01\" data-screen-label=\"Ch01\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">01<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">大会概要<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"max-width: 760px; font-size: 16px; line-height: var(--lh-normal); color: var(--text-secondary);\">\n      らぶぐらっGTは、レース文化および車両文化の発展を目的として開催される長期シリーズ型レースイベントである。本大会は単発レースではなく、全3戦で構成されるシリーズ戦として実施する。各レースの順位に応じてポイントを付与し、全3戦終了時点での合計ポイントによって総合順位を決定する。\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ 02 参加条件 ============ -->\n  <section id=\"ch-02\" data-screen-label=\"Ch02\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">02<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">参加条件<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size: 15px; color: var(--text-muted); margin-bottom: 28px;\">参加チームは、以下の条件をすべて満たしているものとする。<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px;\">\n      <sc-for list=\"{{ conditions }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 22px; display:flex; gap:14px; align-items:flex-start;\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0; margin-top:2px;\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size: 14.5px; line-height: 1.55; color: var(--text-secondary);\">{{ c }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 03 チーム登録ルール ============ -->\n  <section id=\"ch-03\" data-screen-label=\"Ch03\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">03<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">チーム登録ルール<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size: 15px; color: var(--text-muted); margin-bottom: 24px;\">チーム登録における最少人数は、以下の通りとする。<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 32px;\">\n      <div style=\"border: 1px solid var(--accent-border); background: var(--accent-muted); border-radius: var(--radius-lg); padding: 24px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 40px; font-weight: 700; color: var(--accent);\">2<span style=\"font-size:16px; font-weight:500; color:var(--text-muted);\">名〜<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--text-secondary); margin-top: 6px;\">レーサー<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 40px; font-weight: 700; color: var(--text-primary);\">1<span style=\"font-size:16px; font-weight:500; color:var(--text-muted);\">名〜<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--text-secondary); margin-top: 6px;\">ピットクルー（メカニック）<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <ul style=\"margin: 0; padding-left: 20px; color: var(--text-secondary); font-size: 14.5px; line-height: 1.9;\">\n      <li>上記最少人数を超えるメンバー登録は可能とする。<\u002Fli>\n      <li>シーズン期間中は、選手の交代を認める。<\u002Fli>\n      <li>レーサーとして出場する選手2名については、原則として母体企業の従業員は1名までとする。<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- ============ 04 開催日程 ============ -->\n  <section id=\"ch-04\" data-screen-label=\"Ch04\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">04<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">開催日程<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 14px; flex-wrap: wrap;\">\n      <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px 30px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 30px; font-weight: 700; color: var(--text-primary);\">約2ヶ月<\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--text-muted); margin-top: 6px;\">1シーズン・全3戦<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid var(--accent-border); background: var(--accent-muted); border-radius: var(--radius-lg); padding: 24px 30px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 30px; font-weight: 700; color: var(--accent);\">7月末頃<\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--text-secondary); margin-top: 6px;\">第1シーズン開催予定<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 05 レース形式 ============ -->\n  <section id=\"ch-05\" data-screen-label=\"Ch05\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">05<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">レース形式<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 40px;\">\n      <h3 style=\"font-size: 18px; font-weight: 600; color: var(--accent); margin: 0 0 10px;\">当日予選レース<\u002Fh3>\n      <p style=\"max-width: 760px; font-size: 15px; line-height: var(--lh-normal); color: var(--text-secondary);\">\n        各チーム代表者1名が当日予選レースを走行する。Q1として、出走タイミングをずらしタイムアタック形式で走行、上位数チームをQ2進出とし、上位の順位を決定する。決勝レースのスターティンググリッドは、この当日予選のタイムをもとに決定する。\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 32px;\">\n      <h3 style=\"font-size: 18px; font-weight: 600; color: var(--accent); margin: 0 0 10px;\">決勝レース<\u002Fh3>\n      <p style=\"max-width: 760px; font-size: 15px; line-height: var(--lh-normal); color: var(--text-secondary); margin-bottom: 18px;\">\n        2名1組によるリレー形式で実施する。ドライバー交代時には必ずピットインを行い、ピットクルーによる作業を実施しなければならない。外装修理については必要に応じて実施すること。\n      <\u002Fp>\n      <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px;\">\n        <div style=\"font-size: 12px; letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px;\">ピット必須作業<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;\">\n          <div style=\"display:flex; gap:10px; align-items:flex-start;\">\n            <span style=\"color: var(--accent); font-family: var(--font-mono); font-size:12px; margin-top:2px;\">●<\u002Fspan>\n            <span style=\"font-size: 14px; color: var(--text-secondary); line-height:1.5;\">ジェリ缶1本分の燃料補給<br><span style=\"color:var(--text-muted); font-size:12px;\">（満タン時は使い切り不要）<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:10px; align-items:flex-start;\">\n            <span style=\"color: var(--accent); font-family: var(--font-mono); font-size:12px; margin-top:2px;\">●<\u002Fspan>\n            <span style=\"font-size: 14px; color: var(--text-secondary);\">タイヤ整備<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:10px; align-items:flex-start;\">\n            <span style=\"color: var(--accent); font-family: var(--font-mono); font-size:12px; margin-top:2px;\">●<\u002Fspan>\n            <span style=\"font-size: 14px; color: var(--text-secondary);\">ブレーキ整備<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px;\">\n      <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 22px; clip-path: polygon(0 0, 100% 0, 100% 100%, 18px 100%, 0 calc(100% - 18px));\">\n        <div style=\"font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;\">サーキット形式<\u002Fdiv>\n        <p style=\"font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin: 0;\">規定周回数を消化した時点からピットインおよびドライバー交代を可能とする。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 22px; clip-path: polygon(0 0, 100% 0, 100% 100%, 18px 100%, 0 calc(100% - 18px));\">\n        <div style=\"font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;\">スプリント形式<\u002Fdiv>\n        <p style=\"font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin: 0;\">コース中に設定された中継地点にてピット作業およびドライバー交代を行うものとする。<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 06 車両レギュレーション ============ -->\n  <section id=\"ch-06\" data-screen-label=\"Ch06\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">06<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">車両レギュレーション<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 32px;\">\n      <h3 style=\"font-size: 18px; font-weight: 600; color: var(--accent); margin: 0 0 10px;\">使用車両<\u002Fh3>\n      <p style=\"font-size: 15px; color: var(--text-secondary);\">使用可能車両は、バニラ車両のみとする。<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 32px;\">\n      <h3 style=\"font-size: 18px; font-weight: 600; color: var(--accent); margin: 0 0 14px;\">パフォーマンスカスタム<\u002Fh3>\n      <div style=\"display: flex; align-items: center; gap: 16px; margin-bottom: 20px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 44px; font-weight: 700; color: var(--accent);\">8 PP<\u002Fdiv>\n        <div style=\"font-size: 14px; color: var(--text-secondary);\">各チームに付与される<br>パフォーマンスポイント<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 14px; color: var(--text-muted); margin-bottom: 16px;\">以下の項目について、1レベルごとに1 PPを消費してカスタムを行うことができる。<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;\">\n        <sc-for list=\"{{ ppItems }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-md); padding: 16px; text-align: center;\">\n            <div style=\"font-size: 14px; color: var(--text-primary); font-weight: 600;\">{{ p }}<\u002Fdiv>\n            <div style=\"font-family: var(--font-mono); font-size: 11px; color: var(--accent); margin-top: 6px;\">1 PP / Lv<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size: 13px; color: var(--text-muted); margin-top: 16px;\">スタンス調整については、街のルールの範囲内であれば制限を設けない。<\u002Fp>\n    <\u002Fdiv>\n\n    <div>\n      <h3 style=\"font-size: 18px; font-weight: 600; color: var(--accent); margin: 0 0 10px;\">シーズン中の車両変更<\u002Fh3>\n      <p style=\"font-size: 14.5px; color: var(--text-secondary); line-height: 1.7; max-width: 760px;\">\n        シーズン期間中に本戦用車両を変更する場合、チームは運営へ変更申請を行い、変更費用として500万を支払うものとする。車両変更の申請期限は、対象レース開催日の3日前までとする。\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 07 ポイント制度 ============ -->\n  <section id=\"ch-07\" data-screen-label=\"Ch07\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">07<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">ポイント制度<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size: 15px; color: var(--text-muted); margin-bottom: 24px;\">各レース終了時、順位に応じて以下のシリーズポイント（SP）を付与する。<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 2px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; max-width: 900px;\">\n      <sc-for list=\"{{ pointsTable }}\" as=\"row\" hint-placeholder-count=\"8\">\n        <div style=\"background: var(--bg-card); padding: 18px 10px; text-align: center;\">\n          <div style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 8px;\">{{ row.rank }}<\u002Fdiv>\n          <div style=\"font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--accent);\">{{ row.sp }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-size: 12px; color: var(--text-muted); margin-top: 16px;\">※SP配分については、シーズン開始前に変更される場合がある。<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ 08 賞金 ============ -->\n  <section id=\"ch-08\" data-screen-label=\"Ch08\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 20px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">08<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">賞金<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size: 16px; color: var(--text-secondary);\">チーム数次第<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ 09 ハンデ制度 ============ -->\n  <section id=\"ch-09\" data-screen-label=\"Ch09\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">09<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">ハンデ制度<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 20px; border: 1px solid var(--accent-border); background: var(--accent-muted); border-radius: var(--radius-lg); padding: 26px; max-width: 700px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 40px; font-weight: 700; color: var(--accent); white-space: nowrap;\">-3 PP<\u002Fdiv>\n      <p style=\"font-size: 14.5px; color: var(--text-secondary); line-height: 1.6; margin: 0;\">各レースにおいて優勝したチームには、次戦で使用可能なパフォーマンスカスタムポイントを「3 PP減少」させるハンデを適用する。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 10 抗議・審議ルール ============ -->\n  <section id=\"ch-10\" data-screen-label=\"Ch10\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">10<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">抗議・審議ルール<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: grid; gap: 14px; max-width: 780px;\">\n      <p style=\"font-size: 15px; line-height: var(--lh-normal); color: var(--text-secondary); margin: 0;\">全選手は、レース開始から終了までボディカメラの装着および録画を義務とする。録画データは、レース終了後速やかに「らぶぐらっGT」Discordサーバーへ提出しなければならない。<\u002Fp>\n      <p style=\"font-size: 15px; line-height: var(--lh-normal); color: var(--text-secondary); margin: 0;\">故意の接触、危険行為、妨害行為などが発生した場合、対象チームは運営へ抗議申請を行うことができる。運営は提出されたボディカメラ映像をもとに審議を行い、必要に応じて裁定およびペナルティを決定する。<\u002Fp>\n      <p style=\"font-size: 15px; line-height: var(--lh-normal); color: var(--text-muted); margin: 0;\">なお、強制瞑想等でレースが続行不可となった場合には運営側で補填や再走・順位調整などは行わないものとする。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 11 ペナルティ制度 ============ -->\n  <section id=\"ch-11\" data-screen-label=\"Ch11\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">11<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">ペナルティ制度<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"max-width: 760px; font-size: 15px; line-height: var(--lh-normal); color: var(--text-secondary);\">\n      抗議および審議の結果、故意の接触や悪質な妨害行為が確認された場合、加害チームに対してシリーズポイントの減点ペナルティを科す。減点数については、違反行為の悪質性や影響度をもとに運営が判断する。\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ 12 運営育成チームについて ============ -->\n  <section id=\"ch-12\" data-screen-label=\"Ch12\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">12<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">運営育成チームについて<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"max-width: 760px; font-size: 15px; line-height: var(--lh-normal); color: var(--text-secondary); margin-bottom: 20px;\">\n      チーム未所属の選手が予選レースへ参加し、一定以上のタイムを記録した場合、運営判断により「運営育成チーム」として本戦レースへの参加を認める場合がある。\n    <\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; max-width: 780px;\">\n      <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 30px; font-weight: 700; color: var(--accent);\">最大2名<\u002Fdiv>\n        <div style=\"font-size: 12.5px; color: var(--text-muted); margin-top: 6px;\">1レースあたりの参加可能人数<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 30px; font-weight: 700; color: var(--text-primary);\">3日前<\u002Fdiv>\n        <div style=\"font-size: 12.5px; color: var(--text-muted); margin-top: 6px;\">予選記録の参照・選考対象期限<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--text-secondary);\">SP対象外<\u002Fdiv>\n        <div style=\"font-size: 12.5px; color: var(--text-muted); margin-top: 6px;\">運営育成チームの扱い<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 13 禁止事項 ============ -->\n  <section id=\"ch-13\" data-screen-label=\"Ch13\" style=\"padding: 110px 48px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--danger);\">13<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">禁止事項<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size: 15px; color: var(--text-muted); margin-bottom: 24px;\">参加者は、以下の行為を禁止する。<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 28px;\">\n      <sc-for list=\"{{ prohibited }}\" as=\"p\" hint-placeholder-count=\"10\">\n        <div style=\"border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-md); padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start;\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--danger)\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink:0; margin-top:3px;\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size: 13.5px; color: var(--text-secondary); line-height: 1.5;\">{{ p }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-size: 13px; color: var(--text-muted); max-width: 700px;\">禁止事項に該当すると運営が判断した場合、失格・ポイント減点・出場停止などのペナルティを科す場合がある。<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ 14 運営への連絡方法 ============ -->\n  <section id=\"ch-14\" data-screen-label=\"Ch14\" style=\"padding: 110px 48px 160px; max-width: 1180px; margin: 0 auto; border-top: 1px solid var(--border);\">\n    <div style=\"display: flex; align-items: flex-start; gap: 28px; margin-bottom: 40px;\">\n      <span style=\"font-family: var(--font-mono); font-size: 96px; font-weight: 700; line-height: 0.9; color: transparent; -webkit-text-stroke: 2px var(--accent);\">14<\u002Fspan>\n      <h2 style=\"font-size: 38px; font-weight: 700; margin: 6px 0 0; color: var(--text-primary);\">運営への連絡方法<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px;\">\n      <sc-for list=\"{{ contacts }}\" as=\"ct\" hint-placeholder-count=\"3\">\n        <div class=\"a3-hover-glow\" style=\"border-radius: var(--radius-lg); background: var(--bg-card); padding: 24px; border: 1px solid var(--accent);\">\n          <div style=\"font-size: 13px; color: var(--text-muted); margin-bottom: 6px;\">{{ ct.shop }}<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px;\">{{ ct.person }}<\u002Fdiv>\n          <div style=\"font-family: var(--font-mono); font-size: 15px; color: var(--accent);\">{{ ct.phone }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- footer -->\n  <div style=\"border-top: 1px solid var(--border); padding: 40px 48px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;\">\n    <div style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);\">© らぶぐらっGT運営委員会<\u002Fdiv>\n    <div style=\"font-size: 11px; color: var(--text-muted);\">本ルールはシーズン開始前に変更される場合があります。<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._onScroll = () => {\n      const el = document.getElementById('gt-progress');\n      if (!el) return;\n      const h = document.documentElement;\n      const scrolled = h.scrollTop || document.body.scrollTop;\n      const height = (h.scrollHeight || document.body.scrollHeight) - h.clientHeight;\n      const pct = height > 0 ? (scrolled / height) * 100 : 0;\n      el.style.width = pct + '%';\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n  }\n  renderVals() {\n    return {\n      tocItems: [\n        { num: '01', title: '大会概要', href: '#ch-01' },\n        { num: '02', title: '参加条件', href: '#ch-02' },\n        { num: '03', title: 'チーム登録ルール', href: '#ch-03' },\n        { num: '04', title: '開催日程', href: '#ch-04' },\n        { num: '05', title: 'レース形式', href: '#ch-05' },\n        { num: '06', title: '車両レギュレーション', href: '#ch-06' },\n        { num: '07', title: 'ポイント制度', href: '#ch-07' },\n        { num: '08', title: '賞金', href: '#ch-08' },\n        { num: '09', title: 'ハンデ制度', href: '#ch-09' },\n        { num: '10', title: '抗議・審議ルール', href: '#ch-10' },\n        { num: '11', title: 'ペナルティ制度', href: '#ch-11' },\n        { num: '12', title: '運営育成チームについて', href: '#ch-12' },\n        { num: '13', title: '禁止事項', href: '#ch-13' },\n        { num: '14', title: '運営への連絡方法', href: '#ch-14' },\n      ],\n      conditions: [\n        '選手として最低2名のメンバーが所属していること',\n        'ピットクルーとして、選手とは別にメカニックが所属していること',\n        '参加費（1,000万）の支払いが可能であること',\n        'らぶぐらっGT運営より参加承認を受けていること',\n      ],\n      ppItems: ['エンジン', 'ブレーキ', 'トランスミッション', 'サスペンション', 'アーマー'],\n      pointsTable: [\n        { rank: '1位', sp: 22 },\n        { rank: '2位', sp: 16 },\n        { rank: '3位', sp: 12 },\n        { rank: '4位', sp: 8 },\n        { rank: '5位', sp: 6 },\n        { rank: '6位', sp: 4 },\n        { rank: '7位', sp: 2 },\n        { rank: '8位', sp: 1 },\n      ],\n      prohibited: [\n        '街のルールに反する行為',\n        '他者へのなりすまし行為',\n        '故意による接触行為',\n        '危険運転行為',\n        '他車への妨害行為',\n        'レギュレーション外車両の使用',\n        '指定されたパフォーマンス制限を超過した車両の使用',\n        'ピット作業時間を不正に短縮する行為',\n        '運営の指示に従わない行為',\n        '大会進行を妨げる行為',\n      ],\n      contacts: [\n        { shop: 'Ride Out Customs', person: '一条りょう', phone: '(602) 253-4400' },\n        { shop: 'LosSantos Custom', person: 'ミートパイ川崎', phone: '(907) 818-6592' },\n        { shop: 'STO Motors', person: '小豆', phone: '(520) 338-8888' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
