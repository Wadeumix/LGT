<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>らぶぐらっGT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --accent: #3ecf8e;
  --accent-hover: #2db87a;
  --bg-base: #0f0f0f;
  --text-primary: #f2f5f8;
  --text-secondary: #9fb0bf;
}
html, body {
  min-height: 100vh;
  background: radial-gradient(circle at 50% 20%, #182028 0%, #0d1116 55%, #08090c 100%);
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.card {
  max-width: 560px;
  width: 100%;
  text-align: center;
}
.logo {
  height: 84px;
  width: auto;
  object-fit: contain;
  margin-bottom: 34px;
  filter: drop-shadow(0 4px 20px rgba(62,207,142,0.15));
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 18px;
}
h1 {
  font-size: 28px;
  font-weight: 900;
  line-height: 1.6;
  margin-bottom: 18px;
  letter-spacing: 0.5px;
}
h1 .accent { color: var(--accent); }
p.lead {
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 1.9;
  margin-bottom: 40px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--accent);
  color: #08090c;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  padding: 16px 34px;
  border-radius: 999px;
  transition: background 0.2s ease, transform 0.2s ease;
}
.btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
.btn svg { width: 18px; height: 18px; }
.footer {
  margin-top: 48px;
  font-size: 13px;
  letter-spacing: 2px;
  color: #5b6773;
}
</style>
</head>
