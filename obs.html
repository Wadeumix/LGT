<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LGT OBS Overlay</title>
<link rel="stylesheet" href="obs-assets/style.css">
</head>
<body>

  <!-- 上部: チーム紹介(自動切り替え) -->
  <div class="overlay overlay-team">
    <header class="overlay-header">
      <span class="brand">らぶぐらっ<span class="accent">GT</span></span>
      <span class="panel-label">TEAM INTRO</span>
    </header>

    <section class="panel is-active" id="panel-roster">
      <div class="roster-team-name" id="rosterTeamName">TEAM NAME</div>
      <ul class="roster-list" id="rosterList">
        <!-- members injected by data.js -->
      </ul>
    </section>
  </div>

  <!-- 下部: レース中の順位(常時固定表示) -->
  <div class="overlay overlay-race">
    <header class="overlay-header">
      <span class="panel-label live">LIVE POSITION</span>
    </header>

    <section class="panel is-active" id="panel-race">
      <ol class="race-order" id="raceOrderList">
        <!-- positions injected by data.js -->
      </ol>
    </section>
  </div>

  <script src="obs-assets/script.js"></script>
</body>
</html>
