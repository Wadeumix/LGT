  <style>/* ============================================================
   Colors — And 3rd Media
   Dark-first palette. Near-black surfaces step up in lightness
   (base → card → input); a single Supabase-style green accent
   carries all primary action and "success/online" meaning.
   ============================================================ */

:root {
  /* ---- Surfaces (dark, low-chroma, stepped) ---- */
  --bg-base: #0f0f0f;        /* page background */
  --bg-card: #1a1a1a;        /* cards, headers, raised panels */
  --bg-input: #1f1f1f;       /* inputs, wells, dropzone interior */

  /* ---- Borders / hairlines ---- */
  --border: #2a2a2a;         /* default 1px hairline */
  --border-hover: #3a3a3a;   /* scrollbar thumb, subtle hover */

  /* ---- Text ---- */
  --text-primary: #f0f0f0;   /* headings, primary copy */
  --text-secondary: #b4b4b4; /* body, labels */
  --text-muted: #888888;     /* meta, hints, disabled-ish */

  /* ---- Accent (brand green) ---- */
  --accent: #3ecf8e;             /* primary action, links, success */
  --accent-hover: #2db87a;       /* pressed/darker accent */
  --accent-muted: rgba(62, 207, 142, 0.10);   /* accent fill / wash */
  --accent-border: rgba(62, 207, 142, 0.20);  /* accent hairline */

  /* ---- Brand play-mark gradient (logo) ---- */
  --brand-play-from: #b8d4a0;
  --brand-play-to: #7aaa5e;
  --brand-chrome: #c4cdd6;   /* the grey "TV" body */

  /* ---- Status / semantic ---- */
  --danger: #f87171;         /* destructive text + thin bars */
  --danger-strong: #ef4444;  /* destructive button fill, max usage */
  --warn: #f97316;           /* orange — high usage */
  --caution: #eab308;        /* yellow — medium usage / queue busy */

  /* ---- External brand ---- */
  --discord: #5865F2;        /* Discord buttons / links */

  /* ---- Beta banner ---- */
  --beta-bg: #1e293b;        /* slate banner background */
  --beta-text: #94a3b8;      /* slate banner text */

  /* ---- White-glow hover system ---- */
  --glow-line: rgba(255, 255, 255, 0.65);   /* border on hover */
  --glow-ring: rgba(255, 255, 255, 0.15);   /* 1px outline */
  --glow-bloom: rgba(255, 255, 255, 0.08);  /* soft bloom */

  /* ---- Semantic aliases ---- */
  --surface-page: var(--bg-base);
  --surface-card: var(--bg-card);
  --surface-field: var(--bg-input);
  --text-on-accent: #000000;     /* black text on the green button */
  --link: var(--accent);
}
</style>
  <style>/* ============================================================
   Typography — And 3rd Media
   One geometric humanist sans for everything (LINE Seed JP,
   substituted by Zen Kaku Gothic New). Mono only for URLs.
   The UI is compact: most copy sits at 12–14px, headings at
   16–20px. Weights used: 400 / 500 / 600 / 700.
   ============================================================ */

:root {
  /* ---- Families ---- */
  /* Primary stays 'LINE Seed JP'; until its webfonts are uploaded,
     it falls back to the platform JA-capable system sans. */
  --font-sans: 'Noto Sans JP', system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', Meiryo, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  /* ---- Weights ---- */
  --fw-regular: 400;  /* @kind font */
  --fw-medium: 500;   /* @kind font */
  --fw-semibold: 600; /* @kind font */
  --fw-bold: 700;     /* @kind font */

  /* ---- Size scale (compact UI) ---- */
  --text-xs: 0.75rem;    /* 12px — meta, hints, most buttons */
  --text-sm: 0.875rem;   /* 14px — body, labels, titles */
  --text-base: 1rem;     /* 16px */
  --text-lg: 1.125rem;   /* 18px — card headings */
  --text-xl: 1.25rem;    /* 20px — plan price, usage figure */
  --text-2xl: 1.5rem;    /* 24px */
  --text-display: clamp(28px, 6vw, 48px); /* welcome / brand wordmark */

  /* ---- Line heights ---- */
  --lh-tight: 1.1;   /* @kind other */
  --lh-snug: 1.35;   /* @kind other */
  --lh-normal: 1.6;  /* @kind other */

  /* ---- Letter spacing ---- */
  --ls-tight: -0.01em;   /* @kind other */
  --ls-normal: 0;        /* @kind other */
  --ls-wide: 0.02em;     /* @kind other */
  --ls-eyebrow: 0.42em;  /* @kind other */
}
</style>
  <style>/* ============================================================
   Spacing & Radius — And 3rd Media
   4px base rhythm. Radii are generous and soft: pills for
   chips/badges, ~12px for cards, ~8px for inputs/buttons.
   ============================================================ */

:root {
  /* ---- Spacing scale (4px base) ---- */
  --space-1: 0.25rem;   /* 4 */
  --space-2: 0.5rem;    /* 8 */
  --space-3: 0.75rem;   /* 12 */
  --space-4: 1rem;      /* 16 */
  --space-5: 1.25rem;   /* 20 */
  --space-6: 1.5rem;    /* 24 */
  --space-8: 2rem;      /* 32 */
  --space-12: 3rem;     /* 48 */

  /* ---- Radius ---- */
  --radius-sm: 0.375rem;  /* 6px — small buttons, tags */
  --radius-md: 0.5rem;    /* 8px — inputs, buttons, dropzone */
  --radius-lg: 0.75rem;   /* 12px — cards, panels */
  --radius-xl: 1rem;      /* 16px — large surfaces */
  --radius-full: 9999px;  /* pills, badges, orbs, bars */

  /* ---- Hairline width ---- */
  --hairline: 1px;

  /* ---- Common container widths ---- */
  --w-card: 36rem;    /* max-w-xl upload card column */
  --w-page: 64rem;    /* max-w-5xl mypage column */
}
</style>
  <style>/* ============================================================
   Effects — And 3rd Media
   The signature interaction is the WHITE-GLOW hover: interactive
   surfaces sit on a green (--accent) hairline at rest and shift
   to a bright white border + soft white bloom on hover. Buttons
   press with a springy scale(0.94) and emit a ripple. Motion is
   quick (0.12–0.2s); easing is spring on press, ease elsewhere.
   ============================================================ */

:root {
  /* ---- Shadows (used sparingly; surfaces lean on borders) ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 10px 50px rgba(0, 0, 0, 0.35);

  /* ---- White-glow hover (the brand's core hover) ---- */
  --glow-hover: 0 0 0 1px var(--glow-ring), 0 0 14px 3px var(--glow-bloom);

  /* ---- Accent glow (particles, online orbs) ---- */
  --glow-accent: 0 0 6px 2px rgba(62, 207, 142, 0.50);

  /* ---- Glass panel (loading screen lens) ---- */
  --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
  --glass-border: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(16px) saturate(150%); /* @kind other */

  /* ---- Transitions ---- */
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);  /* @kind other */
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);  /* @kind other */
  --t-fast: 0.12s;  /* @kind other */
  --t-base: 0.2s;   /* @kind other */
  --t-slow: 0.6s;   /* @kind other */
}

/* ---- Reusable hover-glow utility (green border → white glow) ---- */
.a3-hover-glow {
  border: var(--hairline) solid var(--accent);
  transition: border-color var(--t-base) ease, box-shadow var(--t-base) ease, color var(--t-base) ease;
}
.a3-hover-glow:hover {
  border-color: var(--glow-line);
  box-shadow: var(--glow-hover);
}

@keyframes a3-btn-white-glow {
  0%, 100% { box-shadow: 0 0 6px 0 rgba(255,255,255,0.10); }
  50%      { box-shadow: 0 0 16px 3px rgba(255,255,255,0.18); }
}
@keyframes a3-ripple-expand {
  0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
}
</style>
  <style>/* ============================================================
   Base — And 3rd Media
   Minimal resets + body defaults so cards/kits inherit the
   brand look automatically. Mirrors the product's globals.css.
   ============================================================ */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-weight: var(--fw-regular);
  font-size: var(--text-sm);
  line-height: var(--lh-snug);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection {
  background: var(--accent-muted);
  color: var(--accent);
}

/* Thin dark scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-base); }
::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: var(--radius-sm); }

a { color: var(--link); text-decoration: none; }
</style>
  <style>/* ============================================================
   And 3rd Media — Design System
   Global stylesheet entry point. Consumers link THIS file.
   Keep this as @import lines only — no rules here.
   ============================================================ */

/* ============================================================
   Fonts — And 3rd Media
   The product UI uses "LINE Seed JP" (a clean geometric JP/Latin
   sans by LINE). Those binaries are not distributed here yet, so
   --font-sans keeps 'LINE Seed JP' as its primary family and falls
   back to the platform's JA-capable system sans until the real
   webfont files are uploaded. No substitute family is loaded.

   ⚠ Upload the LINE Seed JP webfonts and add an @font-face here;
   the token already points at the right family name.

   Only the monospace face (generated URLs) is web-loaded.
   ============================================================ */

/* cyrillic-ext */
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;

/* ============================================================
   Colors — And 3rd Media
   Dark-first palette. Near-black surfaces step up in lightness
   (base → card → input); a single Supabase-style green accent
   carries all primary action and "success/online" meaning.
   ============================================================ */

:root {
  /* ---- Surfaces (dark, low-chroma, stepped) ---- */
  --bg-base: #0f0f0f;        /* page background */
  --bg-card: #1a1a1a;        /* cards, headers, raised panels */
  --bg-input: #1f1f1f;       /* inputs, wells, dropzone interior */

  /* ---- Borders / hairlines ---- */
  --border: #2a2a2a;         /* default 1px hairline */
  --border-hover: #3a3a3a;   /* scrollbar thumb, subtle hover */

  /* ---- Text ---- */
  --text-primary: #f0f0f0;   /* headings, primary copy */
  --text-secondary: #b4b4b4; /* body, labels */
  --text-muted: #888888;     /* meta, hints, disabled-ish */

  /* ---- Accent (brand green) ---- */
  --accent: #3ecf8e;             /* primary action, links, success */
  --accent-hover: #2db87a;       /* pressed/darker accent */
  --accent-muted: rgba(62, 207, 142, 0.10);   /* accent fill / wash */
  --accent-border: rgba(62, 207, 142, 0.20);  /* accent hairline */

  /* ---- Brand play-mark gradient (logo) ---- */
  --brand-play-from: #b8d4a0;
  --brand-play-to: #7aaa5e;
  --brand-chrome: #c4cdd6;   /* the grey "TV" body */

  /* ---- Status / semantic ---- */
  --danger: #f87171;         /* destructive text + thin bars */
  --danger-strong: #ef4444;  /* destructive button fill, max usage */
  --warn: #f97316;           /* orange — high usage */
  --caution: #eab308;        /* yellow — medium usage / queue busy */

  /* ---- External brand ---- */
  --discord: #5865F2;        /* Discord buttons / links */

  /* ---- Beta banner ---- */
  --beta-bg: #1e293b;        /* slate banner background */
  --beta-text: #94a3b8;      /* slate banner text */

  /* ---- White-glow hover system ---- */
  --glow-line: rgba(255, 255, 255, 0.65);   /* border on hover */
  --glow-ring: rgba(255, 255, 255, 0.15);   /* 1px outline */
  --glow-bloom: rgba(255, 255, 255, 0.08);  /* soft bloom */

  /* ---- Semantic aliases ---- */
  --surface-page: var(--bg-base);
  --surface-card: var(--bg-card);
  --surface-field: var(--bg-input);
  --text-on-accent: #000000;     /* black text on the green button */
  --link: var(--accent);
}

/* ============================================================
   Typography — And 3rd Media
   One geometric humanist sans for everything (LINE Seed JP,
   substituted by Zen Kaku Gothic New). Mono only for URLs.
   The UI is compact: most copy sits at 12–14px, headings at
   16–20px. Weights used: 400 / 500 / 600 / 700.
   ============================================================ */

:root {
  /* ---- Families ---- */
  /* Primary stays 'LINE Seed JP'; until its webfonts are uploaded,
     it falls back to the platform JA-capable system sans. */
  --font-sans: 'Noto Sans JP', system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', Meiryo, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  /* ---- Weights ---- */
  --fw-regular: 400;  /* @kind font */
  --fw-medium: 500;   /* @kind font */
  --fw-semibold: 600; /* @kind font */
  --fw-bold: 700;     /* @kind font */

  /* ---- Size scale (compact UI) ---- */
  --text-xs: 0.75rem;    /* 12px — meta, hints, most buttons */
  --text-sm: 0.875rem;   /* 14px — body, labels, titles */
  --text-base: 1rem;     /* 16px */
  --text-lg: 1.125rem;   /* 18px — card headings */
  --text-xl: 1.25rem;    /* 20px — plan price, usage figure */
  --text-2xl: 1.5rem;    /* 24px */
  --text-display: clamp(28px, 6vw, 48px); /* welcome / brand wordmark */

  /* ---- Line heights ---- */
  --lh-tight: 1.1;   /* @kind other */
  --lh-snug: 1.35;   /* @kind other */
  --lh-normal: 1.6;  /* @kind other */

  /* ---- Letter spacing ---- */
  --ls-tight: -0.01em;   /* @kind other */
  --ls-normal: 0;        /* @kind other */
  --ls-wide: 0.02em;     /* @kind other */
  --ls-eyebrow: 0.42em;  /* @kind other */
}

/* ============================================================
   Spacing & Radius — And 3rd Media
   4px base rhythm. Radii are generous and soft: pills for
   chips/badges, ~12px for cards, ~8px for inputs/buttons.
   ============================================================ */

:root {
  /* ---- Spacing scale (4px base) ---- */
  --space-1: 0.25rem;   /* 4 */
  --space-2: 0.5rem;    /* 8 */
  --space-3: 0.75rem;   /* 12 */
  --space-4: 1rem;      /* 16 */
  --space-5: 1.25rem;   /* 20 */
  --space-6: 1.5rem;    /* 24 */
  --space-8: 2rem;      /* 32 */
  --space-12: 3rem;     /* 48 */

  /* ---- Radius ---- */
  --radius-sm: 0.375rem;  /* 6px — small buttons, tags */
  --radius-md: 0.5rem;    /* 8px — inputs, buttons, dropzone */
  --radius-lg: 0.75rem;   /* 12px — cards, panels */
  --radius-xl: 1rem;      /* 16px — large surfaces */
  --radius-full: 9999px;  /* pills, badges, orbs, bars */

  /* ---- Hairline width ---- */
  --hairline: 1px;

  /* ---- Common container widths ---- */
  --w-card: 36rem;    /* max-w-xl upload card column */
  --w-page: 64rem;    /* max-w-5xl mypage column */
}

/* ============================================================
   Effects — And 3rd Media
   The signature interaction is the WHITE-GLOW hover: interactive
   surfaces sit on a green (--accent) hairline at rest and shift
   to a bright white border + soft white bloom on hover. Buttons
   press with a springy scale(0.94) and emit a ripple. Motion is
   quick (0.12–0.2s); easing is spring on press, ease elsewhere.
   ============================================================ */

:root {
  /* ---- Shadows (used sparingly; surfaces lean on borders) ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 10px 50px rgba(0, 0, 0, 0.35);

  /* ---- White-glow hover (the brand's core hover) ---- */
  --glow-hover: 0 0 0 1px var(--glow-ring), 0 0 14px 3px var(--glow-bloom);

  /* ---- Accent glow (particles, online orbs) ---- */
  --glow-accent: 0 0 6px 2px rgba(62, 207, 142, 0.50);

  /* ---- Glass panel (loading screen lens) ---- */
  --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
  --glass-border: rgba(255, 255, 255, 0.18);
  --glass-blur: blur(16px) saturate(150%); /* @kind other */

  /* ---- Transitions ---- */
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);  /* @kind other */
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);  /* @kind other */
  --t-fast: 0.12s;  /* @kind other */
  --t-base: 0.2s;   /* @kind other */
  --t-slow: 0.6s;   /* @kind other */
}

/* ---- Reusable hover-glow utility (green border → white glow) ---- */
.a3-hover-glow {
  border: var(--hairline) solid var(--accent);
  transition: border-color var(--t-base) ease, box-shadow var(--t-base) ease, color var(--t-base) ease;
}
.a3-hover-glow:hover {
  border-color: var(--glow-line);
  box-shadow: var(--glow-hover);
}

@keyframes a3-btn-white-glow {
  0%, 100% { box-shadow: 0 0 6px 0 rgba(255,255,255,0.10); }
  50%      { box-shadow: 0 0 16px 3px rgba(255,255,255,0.18); }
}
@keyframes a3-ripple-expand {
  0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
}

/* ============================================================
   Base — And 3rd Media
   Minimal resets + body defaults so cards/kits inherit the
   brand look automatically. Mirrors the product's globals.css.
   ============================================================ */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-weight: var(--fw-regular);
  font-size: var(--text-sm);
  line-height: var(--lh-snug);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection {
  background: var(--accent-muted);
  color: var(--accent);
}

/* Thin dark scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-base); }
::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: var(--radius-sm); }

    @keyframes heroGlow {

<div style="min-height:100vh; background:var(--bg-base); font-family:var(--font-sans); color:var(--text-primary); padding:0 0 var(--space-12);">

  <div style="max-width:var(--w-page); margin:0 auto; padding:var(--space-12) var(--space-6) var(--space-8);">

    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--space-4); margin-bottom:var(--space-8);">
      <div>
        <p style="margin:0 0 var(--space-2); font-size:var(--text-xs); font-weight:var(--fw-semibold); letter-spacing:var(--ls-eyebrow); color:var(--accent); text-transform:uppercase;">Schedule</p>
        <h1 style="margin:0; font-size:var(--text-display); font-weight:var(--fw-bold); line-height:var(--lh-tight); letter-spacing:var(--ls-tight); animation:heroGlow 3.2s ease-in-out infinite;">
          らぶぐらっ<span style="color:var(--accent);">GT</span>
        </h1>
        <p style="margin:var(--space-2) 0 0; font-size:var(--text-lg); color:var(--text-secondary); font-weight:var(--fw-medium);">当日タイムスケジュール</p>
      </div>
      <x-import component-from-global-scope="And3rdMediaDesignSystem_449b20.Badge" variant="accent" hint-size="auto,28px">
        <span style="display:inline-flex; align-items:center; gap:6px;">
          <span style="width:6px; height:6px; border-radius:50%; background:var(--accent); animation:livePulse 1.6s ease-in-out infinite;"></span>
          7/4 21:00 開催
        </span>
      </x-import>
    </div>

    <div style="position:relative; padding-left:56px;">
      <div style="position:absolute; left:23px; top:6px; bottom:6px; width:2px; background:var(--border); border-radius:2px; overflow:hidden;">
        <div style="position:absolute; left:-3px; width:8px; height:70px; border-radius:9999px; background:linear-gradient(180deg, var(--accent), transparent); filter:blur(2px); box-shadow:var(--glow-accent); animation:railTravel 4.5s linear infinite;"></div>
      </div>

      <sc-for list="{{ schedule }}" as="item" hint-placeholder-count="7">
        <div ref="{{ item.setRef }}" data-idx="{{ item.index }}" style="{{ item.wrapStyle }}">

          <div style="position:relative; margin-bottom:var(--space-8);">
            <div style="position:absolute; left:-56px; top:2px; width:16px; height:16px; border-radius:50%; background:var(--accent); animation:dotPulse 2.2s ease-in-out infinite; animation-delay:{{ item.dotDelay }};"></div>

            <div style="display:flex; align-items:baseline; gap:var(--space-3); margin-bottom:var(--space-3);">
              <span style="font-size:var(--text-xl); font-weight:var(--fw-bold); color:var(--accent); letter-spacing:var(--ls-tight);">{{ item.time }}</span>
              <sc-if value="{{ item.hasSuffix }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:var(--text-sm); color:var(--text-muted);">〜</span>
              </sc-if>
            </div>

            <x-import component-from-global-scope="And3rdMediaDesignSystem_449b20.Card" hover-glow="{{ true }}" padding="1.5rem" style="{{ item.cardStyle }}" hint-size="100%,auto">
              <h2 style="margin:0 0 var(--space-1); font-size:var(--text-lg); font-weight:var(--fw-bold); color:var(--text-primary);">{{ item.title }}</h2>

              <sc-if value="{{ item.hasBullets }}" hint-placeholder-val="{{ false }}">
                <ul style="margin:var(--space-3) 0 0; padding:0 0 0 1.1em; display:flex; flex-direction:column; gap:6px;">
                  <sc-for list="{{ item.bullets }}" as="b" hint-placeholder-count="2">
                    <li style="font-size:var(--text-sm); color:var(--text-secondary); line-height:var(--lh-normal);">{{ b }}</li>
                  </sc-for>
                </ul>
              </sc-if>

              <sc-if value="{{ item.hasSteps }}" hint-placeholder-val="{{ false }}">
                <div style="margin-top:var(--space-5); padding-top:var(--space-5); border-top:1px solid var(--border); display:flex; flex-direction:column; gap:var(--space-4);">
                  <sc-for list="{{ item.steps }}" as="step" hint-placeholder-count="3">
                    <div style="display:flex; gap:var(--space-3);">
                      <div style="flex-shrink:0; width:24px; height:24px; border-radius:50%; background:var(--accent-muted); border:1px solid var(--accent-border); color:var(--accent); font-size:var(--text-xs); font-weight:var(--fw-bold); display:flex; align-items:center; justify-content:center;">{{ step.n }}</div>
                      <div style="flex:1; min-width:0;">
                        <p style="margin:0; font-size:var(--text-sm); font-weight:var(--fw-semibold); color:var(--text-primary);">{{ step.label }}</p>
                        <sc-if value="{{ step.hasDetail }}" hint-placeholder-val="{{ false }}">
                          <p style="margin:2px 0 0; font-size:var(--text-xs); color:var(--text-muted);">{{ step.detail }}</p>
                        </sc-if>
                        <sc-if value="{{ step.hasChecklist }}" hint-placeholder-val="{{ false }}">
                          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--space-2);">
                            <sc-for list="{{ step.checklist }}" as="chk" hint-placeholder-count="4">
                              <x-import component-from-global-scope="And3rdMediaDesignSystem_449b20.Badge" variant="neutral" hint-size="auto,24px">{{ chk }}</x-import>
                            </sc-for>
                          </div>
                        </sc-if>
                      </div>
                    </div>
                  </sc-for>
                </div>
              </sc-if>
            </x-import>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top:var(--space-8); padding-top:var(--space-6); border-top:1px solid var(--border); text-align:center;">
      <p style="margin:0; font-size:var(--text-xs); color:var(--text-muted); letter-spacing:var(--ls-wide);">らぶぐらっGT運営委員会</p>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  state = { visible: {} };
  itemEls = {};
  observer = null;

  componentDidMount() {
    this.observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const idx = Number(entry.target.getAttribute('data-idx'));
          this.setState((s) => (s.visible[idx] ? null : { visible: { ...s.visible, [idx]: true } }));
          this.observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
    Object.values(this.itemEls).forEach((el) => el && this.observer.observe(el));
  }

  componentWillUnmount() {
    if (this.observer) this.observer.disconnect();
  }

  makeRef = (idx) => (el) => {
    if (el && !this.itemEls[idx]) {
      this.itemEls[idx] = el;
      if (this.observer) this.observer.observe(el);
    }
  };

  getRawSchedule() {
    return [
      {
        time: '20:00',
        title: '車貸し出し・車両確認',
        bullets: [],
        steps: [],
      },
      {
        time: '21:00',
        title: '開会式',
        bullets: ['注意事項説明'],
        steps: [],
      },
      {
        time: '21:10',
        title: 'ドライバー・メカニック説明会',
        bullets: ['役割およびレギュレーションの確認'],
        steps: [],
      },
      {
        time: '21:30',
        title: '予選タイムアタック',
        bullets: ['チーム代表1名によるタイムアタック（本戦の予選順位決定）'],
        steps: [],
      },
      {
        time: '22:00',
        title: '本戦レース開始',
        bullets: ['予選順位順にスタート', '運営先導によるウォーミングアップ1周'],
        steps: [
          { n: 1, label: '第1走者走行', detail: '5周目でピットイン', checklist: [] },
          { n: 2, label: 'ピット作業（メカニック担当）', detail: '', checklist: ['燃料補給', 'タイヤ点検', 'ブレーキ点検', '第2走者の準備'] },
          { n: 3, label: '第2走者スタート', detail: 'ピット出口よりレース再開', checklist: [] },
        ],
      },
      {
        time: '23:00',
        title: '閉会式',
        bullets: ['表彰'],
        steps: [],
      },
      {
        time: '閉会式後',
        title: 'エキシビションレース',
        bullets: ['参加希望者全員によるワチャワチャレース'],
        steps: [],
      },
    ];
  }

  renderVals() {
    const visible = this.state.visible;
    const raw = this.getRawSchedule();

    const schedule = raw.map((it, i) => {
      const isVisible = !!visible[i];
      // 最初の項目(20:00)は開館・準備扱いとして控えめに表示し、
      // 21:00(本編スタート)との間に点線の区切りを入れる。
      const isPre = i === 0;
      const steps = (it.steps || []).map((s) => ({
        ...s,
        hasDetail: !!s.detail,
        hasChecklist: (s.checklist || []).length > 0,
      }));
      return {
        ...it,
        index: i,
        hasSuffix: it.time.includes(':'),
        hasBullets: (it.bullets || []).length > 0,
        hasSteps: steps.length > 0,
        steps,
        setRef: this.makeRef(i),
        dotDelay: `${(i % 4) * 0.35}s`,
        wrapStyle: isPre ? {
          opacity: 0.62,
          paddingBottom: 'var(--space-6)',
          borderBottom: '2px dashed rgba(62,207,142,0.4)',
        } : {},
        cardStyle: {
          opacity: isVisible ? 1 : 0,
          transform: isVisible ? 'translateY(0)' : 'translateY(28px)',
          transition: 'opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out)',
        },
      };
    });

    return { schedule };
  }
}

</script>
